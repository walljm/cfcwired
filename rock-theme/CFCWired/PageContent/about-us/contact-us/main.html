<!-- Contact Form Section -->
<div class="py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow">
                <div class="card-body p-5">
                    <h3 class="mb-4">Contact Us</h3>
                    <p class="text-muted mb-4">Fields marked with an * are required</p>

                    <form action="#" method="post">
                        <div class="mb-4">
                            <label for="name" class="form-label">Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-4">
                            <label for="message" class="form-label">Message *</label>
                            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Recaptcha</label>
                            <div class="border rounded p-3 bg-light"></div>
                        </div>

                        <div class="mb-4">
                            <div class="ratio" style="--bs-aspect-ratio: 18%;">
                                <iframe title="reCAPTCHA" src="https://www.google.com/recaptcha/api2/anchor?ar=1&k=6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI&co=aHR0cHM6Ly9jZmN3aXJlZC5vcmc6NDQz&hl=en&type=image&v=9qFwm1mN9w4af5-kd-DQQQ4u&size=normal&cb=contactWidget" loading="lazy"></iframe>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
